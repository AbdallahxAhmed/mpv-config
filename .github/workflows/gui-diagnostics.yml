name: GUI diagnostics
on:
  push:
    branches: [feat/youtube-captions-smart-tracks]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.capture.outputs.cases }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4 mpv
      - id: capture
        env:
          NATIVE_MPV_REQUIRED: '1'
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          cases = []
          commands = [
              ('Hook', ['lua5.4', 'tests/lua/test_ytdl_hook.lua']),
              ('Caption load', ['python3', 'tests/test_youtube_runtime.py', 'CaptionPlayback.test_load_and_reuse', '-v']),
              ('Caption cancel', ['python3', 'tests/test_youtube_runtime.py', 'CaptionPlayback.test_cancel_on_file_change', '-v']),
          ]
          for name, command in commands:
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=45)
                  output = result.stdout + result.stderr
                  code = result.returncode
              except subprocess.TimeoutExpired as error:
                  output, code = str(error), 1
              print(name + ':\n' + output)
              terms = ('error', 'failed', 'missing', 'unavailable', 'cannot', 'not found', "can't", '.lua:')
              lines = [line.strip() for line in output.splitlines() if any(term in line.lower() for term in terms)]
              preferred = [line for line in lines if 'ytdl_sub_menu' in line or 'Caption helper' in line]
              lines = preferred + [line for line in lines if line not in preferred]
              summary = ' | '.join(lines[:3])[:210] if code else 'passed'
              cases.append({'label': name + ': ' + (summary or 'failed; see probe log'), 'code': code})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('cases=' + json.dumps({'include': cases}) + '\n')
          PY
  result:
    needs: probe
    if: always() && needs.probe.outputs.cases != ''
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.probe.outputs.cases) }}
    steps:
      - env:
          RESULT: ${{ matrix.code }}
        run: test "$RESULT" = "0"
