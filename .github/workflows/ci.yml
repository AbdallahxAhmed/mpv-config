name: CI

on:
  push:
  pull_request:

# Read-only by default. No secrets, no pull_request_target, no self-editing.
permissions:
  contents: read

jobs:
  compile:
    name: Byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Byte-compile the deployment code
        run: python -m compileall -q setup.py deploy tests

  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run the test suite
        run: python -m unittest discover -s tests -v

  # tests/test_audit_patches.py is the only red module. Its assertions cover
  # unrelated subsystems, so they are grouped here and each group reports as
  # its own check run. "mocked" is the control group: it needs no repository
  # content and passes in a bare sandbox, so a failure there means a real
  # regression rather than a missing fixture.
  audit-patch:
    name: Audit patches (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: mocked
            tests: >-
              test_ensure_mpv_conf_user_creates_when_absent
              test_ensure_mpv_conf_user_never_overwrites_existing
              test_ensure_mpv_conf_user_strips_self_include
              test_windows_native_hwdec_pinned_to_d3d11va
              test_verifier_mpv_launch_includes_idle_no
              test_verifier_startup_check_disables_scripts
              test_ensure_windows_shortcuts_enforces_userprofile_working_directory
              test_smart_paste_type_safe_clipboard
              test_detect_maps_fedora_platform_key
          - group: mpv-conf-template
            tests: >-
              test_template_profile_cond_nil_safe
              test_template_streaming_inherits_sync
              test_template_volume_max_200
              test_template_watch_later_options_persists_volume_mute
              test_template_youtube_startup_latency_options
              test_template_1080p_high_bitrate_stream_selection
              test_mpv_conf_template_idle_mode
              test_mpv_conf_template_clipboard_monitor_and_default_include
          - group: input-conf
            tests: >-
              test_input_conf_dynaudnorm_and_limiter
              test_input_conf_mouse_right_click_bindings
              test_input_conf_clipboard_binding
              test_input_conf_arabic_twin_bindings
              test_migrate_input_conf_updates_f8_and_preserves_custom
              test_migrate_input_conf_updates_mbtn_right_from_context_menu
              test_migrate_input_conf_appends_mbtn_right_when_absent
              test_migrate_input_conf_appends_clipboard_when_absent
              test_migrate_input_conf_upgrades_raw_clipboard
              test_migrate_input_conf_appends_arabic_twins
          - group: script-opts
            tests: >-
              test_thumbfast_config_exists_and_valid
              test_ytdl_hook_conf_and_pinned_binary
              test_uosc_controls_toolbar_configured
          - group: vendored-scripts
            tests: >-
              test_vendored_scripts_exist_and_patched
          # Split one test per check run: this group is the only red one, and
          # the four tests exercise different call sites.
          - group: sync-deps-dry-run
            tests: test_sync_dependencies_dry_run
          - group: sync-deps-read-only
            tests: test_sync_dependencies_dry_run_is_read_only
          - group: uv-tool-bin-dir
            tests: test_installer_uv_tool_uses_env_bin_dir
          - group: extract-overrides
            tests: test_extract_overrides_ignores_include_directive
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run the group
        run: |
          set -u
          args=""
          for name in $TESTS; do
            args="$args tests.test_audit_patches.TestAuditPatches.$name"
          done
          python -m unittest $args -v
        env:
          TESTS: ${{ matrix.tests }}

  # Diagnostic: the dry-run read-only assertion is the only red one left, and
  # it checks three guarantees at once. Each is probed separately here so the
  # violated guarantee is named by the job title. Both side-effecting calls are
  # patched out in every probe, so these jobs stay read-only.
  dry-run-guarantee:
    name: Dry run (${{ matrix.guarantee }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - guarantee: no-makedirs
            probe: |
              import unittest.mock as m
              import deploy.installer as installer
              from deploy.detector import Environment
              env = Environment(os="windows", platform_key="windows", gpu_vendor="nvidia")
              with m.patch("deploy.installer.os.makedirs") as makedirs, \
                   m.patch("deploy.installer._add_to_path"):
                  installer.sync_dependencies(env=env, dry_run=True)
              raise SystemExit("os.makedirs was called during a dry run" if makedirs.called else 0)
          - guarantee: no-path-edit
            probe: |
              import unittest.mock as m
              import deploy.installer as installer
              from deploy.detector import Environment
              env = Environment(os="windows", platform_key="windows", gpu_vendor="nvidia")
              with m.patch("deploy.installer.os.makedirs"), \
                   m.patch("deploy.installer._add_to_path") as add_to_path:
                  installer.sync_dependencies(env=env, dry_run=True)
              raise SystemExit("_add_to_path was called during a dry run" if add_to_path.called else 0)
          - guarantee: all-skipped
            probe: |
              import unittest.mock as m
              import deploy.installer as installer
              from deploy.detector import Environment
              env = Environment(os="windows", platform_key="windows", gpu_vendor="nvidia")
              with m.patch("deploy.installer.os.makedirs"), \
                   m.patch("deploy.installer._add_to_path"):
                  results = installer.sync_dependencies(env=env, dry_run=True)
              bad = sorted({"%s=%s" % (r.get("name"), r.get("status")) for r in results if r.get("status") != "skipped"})
              raise SystemExit("not skipped: " + ", ".join(bad) if bad else 0)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Probe the guarantee
        run: python -c "$PROBE"
        env:
          PROBE: ${{ matrix.probe }}

  lua:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends lua5.4
      - name: Check every vendored script parses
        run: |
          status=0
          for file in scripts/*.lua; do
            if lua5.4 -e "assert(loadfile('$file'))" ; then
              echo "ok: $file"
            else
              echo "FAILED: $file"
              status=1
            fi
          done
          exit "$status"

  shell:
    name: Bootstrap script parsing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check bash bootstrap
        run: bash -n install.sh
      - name: Check PowerShell bootstrap
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ./install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Output 'install.ps1 parses'
