# Maximum thumbnail generation size in pixels (scaled down to fit)
max_height=200
max_width=200

# Enable thumbnail generation on network / streaming playback (YouTube, HTTPS, etc.)
network=yes

# Enable hardware decoding in the background thumbnail process
hwdec=yes

# Pre-spawn thumbnailer on file load so first hover is instant (eliminates initial black thumbnail)
spawn_first=yes

# Windows only: use native Windows API to write directly to named pipe (prevents stuck thumbnail preview)
direct_io=no

# Close thumbnailer process after inactivity period in seconds (0 to disable)
quit_after_inactivity=120
