# Default streaming quality ceiling (video height in pixels).
#
# This is the single source of truth for streaming quality:
#   - scripts/ytdl_hook.lua builds ytdl-format from it for every new stream
#     (mpv.conf no longer pins ytdl-format itself).
#   - scripts/player-toolbar.lua marks the default in the Quality menu and
#     uses it as the download fallback.
#
# Choose a default_quality value: 4320 / 2160 / 1440 / 1080 / 720 / 480 / 360 / 240 / 144
#   0 = no cap (yt-dlp picks the best available source quality).
#
# Per-video overrides: the uosc Quality button applies to the current session;
# "Save current as default" from the same menu writes this file for you.
# Settings you change by hand are personal: the installer never rewrites an
# existing stream_quality.conf (delete it and reinstall to re-seed).
default_quality=1080
