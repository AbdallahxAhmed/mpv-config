# anime_series.conf - titles you want the anime profile for.
#
# OPTIONAL. One entry per line, "series=<title>". The picker cleans
# the file name (drops the release tags, the group and the episode
# number) and looks for your title inside what is left.
#
# This is only a HINT (worth 2 points): the list changes with every
# season you finish, so it must never be the thing that decides. The
# signals that keep working are the release group, the Japanese audio
# track and the episode marker - they describe the RELEASE, not the
# series.
#
# Example (uncomment if you like):
# series=JoJo no Kimyou na Bouken - Steel Ball Run
