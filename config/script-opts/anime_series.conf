# anime_series.conf - titles you want the anime profile for.
#
# One entry per line, "series=<title>". The picker cleans the file name
# (drops the release tags, the group and the episode number) and looks for
# your title inside what is left, so a torrent name like
#   [Erai-raws] JoJo no Kimyou na Bouken - Steel Ball Run - 05 [1080p].mkv
# matches
#   series=JoJo no Kimyou na Bouken - Steel Ball Run
#
# An entry here is worth 4 points - enough on its own - so this is the
# reliable way to cover a series the heuristics would miss.
#
# Example:
# series=JoJo no Kimyou na Bouken - Steel Ball Run
# series=Frieren: Beyond Journey's End
