# profile_picker.conf - anime detection and profile selection.
#
# The picker decides whether the file being played is anime and applies the
# matching mpv profile (Anime4K + the anime scalers, or the light
# live-action profile). Every signal is offline; nothing is looked up.
#
# Score needed before the anime profile is applied. Raise it to be strict,
# lower it to catch more anime. The individual signals weigh:
#   known release group  4      anime series in your list  4
#   Japanese audio track + episode marker  3
#   Japanese audio track + multi-language release  2
#   Japanese audio track alone  1     episode marker alone  1
#   multi-language release alone  1    a folder named "anime"  1
enabled=yes

# 3 = the shipped default.
threshold=3

# Apply the anime profile to network streams too (YouTube anime keeps a
# Japanese audio track, so the same signals work there).
detect_streams=yes

# Release groups that only ship anime. Add your own, comma separated.
groups=Erai-raws,SubsPlease,Anime Time,Judas,Commie,HorribleSubs,Doki,Vivid,Arid,Anime-Kaizoku,Mysterious,ASW,SubsMind,Anime-Shin,ktos,anime-ko,Dokkoida,Getsuga,Neko-Raws,SweetSub,Raws-4U,Trix,Aergo,Raws-Media,Empersor,Mokke,Beatrice-Raws,Dashtail,Kantai,yoroi,kirakira,Lilith-Raws,Tsukikage,Anime_Gear,Project_Noanime,EMBER,gg
