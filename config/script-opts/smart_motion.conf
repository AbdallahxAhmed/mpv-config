# smart_motion.conf — Algorithmic motion clarity configuration
# Automatically configures clock synchronization, temporal interpolation,
# and temporal scaling based on mathematical cadence analysis.

# Master switch: enable intelligent motion automation
enabled=yes

# Web parity: network streams (YouTube/Twitch) use native audio clock
# to eliminate buffering stalls and speed warping, matching browser fluidity.
# Default is 'no' to keep 144Hz display-resample loop and smooth UI rendering.
stream_web_parity=no

# Videos at or above this framerate use crisp raw presentation (no interpolation)
high_fps_threshold=50.0

# Tolerance for snapping non-exact refresh rates to integer multiples (e.g. 143.981Hz / 23.976fps)
cadence_tolerance=0.005

# Show brief on-screen message when profile adapts (default: silent for clean UX)
osd_notifications=no

# Settling delay in seconds after file load for decoder timestamps to stabilize
settle_delay=0.25

# Temporal interpolation filter.
# oversample = point-sample sample-and-hold: crisp, no translucent ghost
# trails on 24/25/30fps content at 144Hz (the "sluggish motion" artifact).
# linear = temporal cross-fade: softer, but trails moving edges.
# Both measure IDENTICALLY in mpv's own telemetry (vsync-ratio 6, vsync-jitter
# ~5e-05, 0 mistimed, 0 drops on 23.976fps / 143.981Hz) - vsync-jitter is a
# presentation-timing metric that the scaler filter cannot influence. Pick
# by look, not by telemetry.
default_tscale=oversample
