<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Map and isolate uosc icon & texture fonts from global web-font overrides -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>uosc_icons</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Material Icons Round</string>
        </edit>
        <edit name="weight" mode="assign" binding="strong">
            <const>regular</const>
        </edit>
        <edit name="slant" mode="assign" binding="strong">
            <const>roman</const>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>MaterialIconsRound</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Material Icons Round</string>
        </edit>
        <edit name="weight" mode="assign" binding="strong">
            <const>regular</const>
        </edit>
        <edit name="slant" mode="assign" binding="strong">
            <const>roman</const>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>MaterialIconsRound-Regular</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Material Icons Round</string>
        </edit>
        <edit name="weight" mode="assign" binding="strong">
            <const>regular</const>
        </edit>
        <edit name="slant" mode="assign" binding="strong">
            <const>roman</const>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>Material Icons Round</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Material Icons Round</string>
        </edit>
        <edit name="weight" mode="assign" binding="strong">
            <const>regular</const>
        </edit>
        <edit name="slant" mode="assign" binding="strong">
            <const>roman</const>
        </edit>
    </match>

    <match target="pattern">
        <test qual="any" name="family">
            <string>uosc_textures</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>uosc_textures</string>
        </edit>
        <edit name="weight" mode="assign" binding="strong">
            <const>regular</const>
        </edit>
        <edit name="slant" mode="assign" binding="strong">
            <const>roman</const>
        </edit>
    </match>

    <!-- Protect mpv preferred UI / subtitle fonts from generic web font overrides -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>Tahoma</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Tahoma</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>Noto Sans Arabic</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Noto Sans Arabic</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>Noto Sans</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>Noto Sans</string>
        </edit>
    </match>
    <match target="pattern">
        <test qual="any" name="family">
            <string>DejaVu Sans</string>
        </test>
        <edit name="family" mode="assign_replace" binding="strong">
            <string>DejaVu Sans</string>
        </edit>
    </match>
</fontconfig>
